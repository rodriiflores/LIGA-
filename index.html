/* Planilla de liga: encabezado tipo marcador con líneas de cancha, pestañas por sección, tabla con columnas fijas. */
:root{
  --display:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --body:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;
  --bg:#e8ece6;--surface:#f6f8f3;--ink:#0f1f17;--muted:#56655d;
  --line:#cbd4cc;--line-soft:#dbe2dc;
  --accent:#0a7a4a;--on-accent:#ffffff;--tint:#dcebe1;--edge:rgba(15,31,23,.5);
  --win:#1b7f45;--draw:#5d6a72;--loss:#c23b3b;--pill-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1612;--surface:#15221c;--ink:#e4eee8;--muted:#92a69b;
    --line:#2a3c33;--line-soft:#1f2e27;
    --accent:#56c28f;--on-accent:#06150e;--tint:#183226;--edge:rgba(228,238,232,.55);
    --win:#47b878;--draw:#8b9aa3;--loss:#e8706e;--pill-ink:#07110c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1612;--surface:#15221c;--ink:#e4eee8;--muted:#92a69b;
  --line:#2a3c33;--line-soft:#1f2e27;
  --accent:#56c28f;--on-accent:#06150e;--tint:#183226;--edge:rgba(228,238,232,.55);
  --win:#47b878;--draw:#8b9aa3;--loss:#e8706e;--pill-ink:#07110c;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body)}
*{box-sizing:border-box}
.wrap{--sw:64px;max-width:880px;margin:0 auto;padding-block:18px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap[data-edit]{--sw:116px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Encabezado */
.head{position:relative;overflow:hidden;padding:4px 0 18px}
.pitch{position:absolute;right:-46px;top:-8px;width:250px;height:auto;color:var(--line);z-index:0}
.head>*:not(.pitch){position:relative;z-index:1}
.kick{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-height:34px}
h1{margin:8px 0 6px;font:900 clamp(42px,12vw,80px)/.9 var(--display);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.meta{margin:0;color:var(--muted);font-weight:500}
.rules{margin:8px 0 0;max-width:60ch;font-size:14px}
.prog{margin-top:16px;max-width:520px}
.progtrack{height:6px;background:var(--line);overflow:hidden}
.progtrack span{display:block;height:100%;background:var(--accent)}
.prog p{margin:6px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Botones */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:3px;font-weight:600;font-size:13px;cursor:pointer;letter-spacing:.02em}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--loss)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px}

/* Pestañas */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs a{display:block;text-align:center;padding:11px 2px 9px;font:800 clamp(15px,4.6vw,20px)/1 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-1px;overflow:hidden;text-overflow:ellipsis}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Avisos */
.note{border:1px dashed var(--accent);background:var(--tint);padding:12px 14px;margin-bottom:16px;display:grid;gap:10px}
.note p{margin:0;font-size:14px}
.empty{padding:28px 4px;color:var(--muted);max-width:52ch}
.empty b{color:var(--ink)}

/* Escudos */
.crestw{display:inline-block;flex:none;line-height:0;filter:drop-shadow(0 0 .6px var(--edge)) drop-shadow(0 0 .6px var(--edge))}
.crest{--s:26px;display:grid;justify-items:center;align-content:start;width:var(--s);height:calc(var(--s)*1.15);padding-top:calc(var(--s)*.15);
  background:linear-gradient(var(--c1) 0 66%,var(--c2) 66% 100%);color:var(--ci);
  clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
.crest b{font-family:var(--display);font-weight:800;font-size:calc(var(--s)*.42);line-height:1;letter-spacing:.02em}
.crest.lg{--s:44px}
.crest.sm{--s:20px}

/* Tabla */
.tw{overflow-x:auto;background:var(--surface);border-top:2px solid var(--ink)}
table.std{border-collapse:separate;border-spacing:0;width:100%;min-width:600px;font-variant-numeric:tabular-nums}
.std th,.std td{padding:9px 7px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line-soft)}
.std th{padding-block:10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.std .pos{position:sticky;left:0;width:40px;min-width:40px;background:var(--surface);z-index:1}
.std .club{position:sticky;left:40px;min-width:158px;text-align:left;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line-soft)}
.club .cl{display:flex;align-items:center;gap:9px;font-weight:600}
.posn{display:inline-grid;place-items:center;width:24px;height:24px;font:800 15px/1 var(--display)}
tr.lead .posn{background:var(--accent);color:var(--on-accent)}
tr.lead .cl{font-weight:700}
.pts{font:800 21px/1 var(--display)}
.std td.dg{color:var(--muted)}
.forms{display:inline-flex;gap:3px}
.f{display:inline-grid;place-items:center;width:18px;height:18px;font-size:10px;font-weight:700;color:var(--pill-ink)}
.f.G{background:var(--win)}.f.E{background:var(--draw)}.f.P{background:var(--loss)}
.legend{margin:12px 0 0;font-size:12.5px;color:var(--muted);max-width:70ch}

.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.in,.tools select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:7px 8px;min-width:0}
details.round{border-top:2px solid var(--ink);background:var(--surface);margin-bottom:14px}

.rc{font-size:12.5px;color:var(--muted)}

.mrow,.gl-line{display:grid;grid-template-columns:minmax(0,1fr) var(--sw) minmax(0,1fr);align-items:center;gap:8px}
.side{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;line-height:1.2}
.side.h{justify-content:flex-end;text-align:right}
.score{display:flex;justify-content:center;align-items:baseline;gap:7px;font:800 28px/1 var(--display);font-variant-numeric:tabular-nums}
.score i{font-style:normal;color:var(--muted);font-size:20px}
.score.vs{font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.score .lo{color:var(--muted)}
.gl-line{margin-top:5px;font-size:12.5px;color:var(--muted);line-height:1.3}
.gl-line .h{text-align:right}
.sc-edit{display:flex;align-items:center;justify-content:center;gap:6px}
.sc{width:46px;padding:6px 2px;text-align:center;font:800 22px/1 var(--display);background:var(--bg);border:1px solid var(--line);border-radius:2px;-moz-appearance:textfield}
.sc::-webkit-outer-spin-button,.sc::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.goals-edit{margin-top:8px;display:grid;gap:8px;justify-items:start}
.gl{display:grid;gap:6px;width:100%;max-width:520px}
.grow{display:grid;grid-template-columns:64px minmax(0,1fr) 56px 32px;gap:6px;align-items:center}
.grow .in{width:100%}
.x{border:1px solid var(--line);background:var(--surface);height:32px;cursor:pointer;color:var(--loss);font-size:18px;line-height:1}

/* Goleadores */
.rank{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border-top:2px solid var(--ink);font-variant-numeric:tabular-nums}
.rank td,.rank th{padding:10px 8px;border-bottom:1px solid var(--line-soft);text-align:left}
.rank th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rank .n{width:34px;text-align:center;color:var(--muted);font-weight:600}
.rank .pl{font-weight:600}
.rank .tm{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}
.rank .g{width:34%;min-width:96px}
.gbar{display:flex;align-items:center;gap:8px}
.gbar span{height:8px;background:var(--accent);display:block;min-width:2px}
.gbar b{font:800 20px/1 var(--display)}

.sec{margin:24px 0 10px;font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.sec:first-child{margin-top:0}
.rank .tm.in{color:var(--ink);font-size:15px;font-weight:600}
.rank th.pj,.rank td.pj{width:48px;text-align:center;color:var(--muted)}

ul.roster{list-style:none;margin:0;padding:0;background:var(--surface);border-top:2px solid var(--ink)}
.trow{display:flex;align-items:center;gap:14px;padding:12px;border-bottom:1px solid var(--line-soft)}
.tinfo{flex:1;min-width:0}
.tname{display:block;font:800 22px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em}
.town{font-size:13px;color:var(--muted)}
.trec{text-align:right;font-variant-numeric:tabular-nums}
.trec b{display:block;font:800 26px/1 var(--display)}
.trec span{font-size:12px;color:var(--muted)}
.trow.edit{align-items:flex-start}
.fields{flex:1;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fields label,.cfg label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.fields .in,.cfg .in{width:100%;color:var(--ink);font-weight:500;font-size:14px}
.cols{display:flex;gap:6px}
input[type=color]{width:44px;height:34px;padding:2px;border:1px solid var(--line);background:var(--surface);border-radius:2px}
.cfg{display:grid;gap:12px;background:var(--surface);border-top:2px solid var(--ink);padding:14px 12px;margin-bottom:18px;max-width:640px}
.cfg h2{margin:0;font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.hint{margin:0;font-size:13px;color:var(--muted)}

/* Barra de guardado */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);
  display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.savebar .st{font-size:13px;font-weight:600;min-width:0}
.savebar .btn{background:transparent;border-color:color-mix(in srgb,var(--bg) 45%,transparent);color:var(--bg)}
.savebar .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

}

      const a=arr[i],b=arr[n-1-i];if(a==null||b==null)continue;
      const flip=(r%2===0)?(i%2===0):(i%2===1);
      out.push({round:r+1,h:flip?a:b,a:flip?b:a});
    }
    arr=[arr[0],arr[n-1]].concat(arr.slice(1,n-1));
  }
  if(legs===2){out.slice().forEach(m=>out.push({round:m.round+rs,h:m.a,a:m.h}))}
  return out.map((m,i)=>({id:"m"+(i+1),round:m.round,h:m.h,a:m.a,hs:null,as:null,goals:[]}));
}
/* ---------- Estado ---------- */
let saved=null;
try{saved=JSON.parse($("#data").textContent)}catch(e){}
let state=saved||{name:"Liga TT",season:"",rules:"",legs:1,teams:[],matches:[]};
let baseline=JSON.stringify(state);
const tabFromHash=()=>{const h=location.hash.slice(1);return TABS.indexOf(h)>=0?h:"tabla"};
const view={tab:tabFromHash(),edit:false,club:"",goalsOpen:new Set(),confirm:null,msg:"",saving:false,stash:null};
let canEdit=false,api=null,ct=null;
const dirty=()=>JSON.stringify(state)!==baseline;
const team=id=>state.teams.find(t=>t.id===id);
const nm=t=>t.club||t.owner||"Sin nombre";
const isPlayed=m=>Number.isInteger(m.hs)&&Number.isInteger(m.as);

/* ---------- Cálculos ---------- */
function standings(){
  const map=new Map(state.teams.map(t=>[t.id,{t:t,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0,form:[]}]));
  state.matches.map((m,i)=>({m:m,i:i})).filter(x=>isPlayed(x.m)).sort((a,b)=>a.m.round-b.m.round||a.i-b.i).forEach(x=>{
    const m=x.m,H=map.get(m.h),A=map.get(m.a);if(!H||!A)return;
    H.pj++;A.pj++;H.gf+=m.hs;H.gc+=m.as;A.gf+=m.as;A.gc+=m.hs;
    if(m.hs>m.as){H.g++;A.p++;H.pts+=3;H.form.push("G");A.form.push("P")}
    else if(m.hs<m.as){A.g++;H.p++;A.pts+=3;A.form.push("G");H.form.push("P")}
    else{H.e++;A.e++;H.pts++;A.pts++;H.form.push("E");A.form.push("E")}
  });
  return Array.from(map.values()).sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf||nm(a.t).localeCompare(nm(b.t),"es"));
}
function scorers(){
  const map=new Map();
  state.matches.forEach(m=>{(m.goals||[]).forEach(g=>{
    const p=(g.p||"").trim();if(!p)return;
    const tid=g.s==="a"?m.a:m.h,k=tid+"|"+p.toLowerCase();
    const c=map.get(k)||{p:p,tid:tid,n:0};c.n+=Math.max(0,g.n|0);map.set(k,c);
  })});
  return Array.from(map.values()).filter(x=>x.n>0&&team(x.tid)).sort((a,b)=>b.n-a.n||a.p.localeCompare(b.p,"es"));
}
function roundsInfo(){
  const rs=new Map();
  state.matches.forEach(m=>{if(!rs.has(m.round))rs.set(m.round,[]);rs.get(m.round).push(m)});
  const nums=Array.from(rs.keys()).sort((a,b)=>a-b);
  let cur=nums.find(r=>rs.get(r).some(m=>!isPlayed(m)));
  if(cur===undefined)cur=nums[nums.length-1];
  return {rs:rs,nums:nums,cur:cur};
}

function goalsLine(m){
  if(!(m.goals&&m.goals.length))return "";
  const part=s=>{const g={};m.goals.filter(x=>x.s===s&&x.p&&x.p.trim()).forEach(x=>{const k=x.p.trim();g[k]=(g[k]||0)+(x.n|0)});
    return Object.keys(g).map(p=>g[p]>1?esc(p)+" ×"+g[p]:esc(p)).join(", ")};
  const a=part("h"),b=part("a");
  if(!a&&!b)return "";
  return '<div class="gl-line"><span class="h">'+a+'</span><span></span><span>'+b+'</span></div>';
}

        +'<input class="in" type="text" id="'+b+'-p" data-m="'+m.id+'" data-g="'+i+'" data-gf="p" maxlength="30" placeholder="Jugador" aria-label="Jugador" value="'+esc(g.p)+'">'

        +'<button class="x" type="button" data-act="delgoal" data-m="'+m.id+'" data-g="'+i+'" aria-label="Quitar gol">×</button></div>';

function matchHTML(m){

}

  const E="</scr"+"ipt>";
  return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>"+reset()+"</style></head><body>"
   +"<title>"+TITLE+"</title><meta name=\"claude:viewport-fit-sides\" content=\"cover\">"

   +"<style id=\"app-style\">"+css+"</style><div id=\"app\"></div>"
   +"<script type=\"application/json\" id=\"data\">"+json+E
   +"<script id=\"app-code\">"+code+E+"</body></html>";

async function save(){
  if(!api||view.saving||!dirty())return;
  view.saving=true;view.msg="Guardando…";renderBar();
  try{sessionStorage.setItem(SKEY,JSON.stringify(state))}catch(e){}
  try{await api.publish(buildDoc())}
  catch(err){
    view.saving=false;
    const c=err&&err.code;
    if(c==="conflict")view.msg="Alguien guardó antes. La página se actualiza y tus cambios quedan para recuperar.";
    else if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="consent_required"||c==="capability_disabled"||c==="capability_removed"){canEdit=false;view.edit=false;view.msg="";renderAll();return}
    else if(c==="rate_limited")view.msg="Guardaste muy seguido. Esperá unos segundos y probá de nuevo.";
    else if(c==="too_large")view.msg="La liga es demasiado grande para guardarse.";
    else view.msg="No se pudo guardar. Probá de nuevo.";
    renderBar();
  }
}

/* ---------- Eventos ---------- */
const app=$("#app");
mount();
app.addEventListener("click",e=>{
  const tabEl=e.target.closest("a[data-tab]");
  if(tabEl){e.preventDefault();view.tab=tabEl.dataset.tab;applyTab();try{if(location.hash.slice(1)!==view.tab)location.hash=view.tab}catch(err){}return}
  const el=e.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act,id=el.dataset.m,m=id?state.matches.find(x=>x.id===id):null;
  if(act==="toggleedit"){view.edit=!view.edit;view.confirm=null;renderAll()}
  else if(act==="goals"&&m){if(view.goalsOpen.has(id))view.goalsOpen.delete(id);else view.goalsOpen.add(id);replaceMatch(id)}
  else if(act==="addgoal"&&m){m.goals.push({s:"h",p:"",n:1});view.goalsOpen.add(id);replaceMatch(id);derived();
    const f=document.getElementById("g-"+id+"-"+(m.goals.length-1)+"-p");if(f)f.focus()}
  else if(act==="delgoal"&&m){m.goals.splice(+el.dataset.g,1);replaceMatch(id);derived()}
  else if(act==="addteam"){
    const pal=["#2f6fed","#e8590c","#7048e8","#0ca678","#d6336c","#f59f00","#1098ad","#9c36b5"];
    const n=Math.max(0,...state.teams.map(t=>parseInt(t.id.slice(1),10)||0))+1;
    state.teams.push({id:"t"+n,club:"Jugador nuevo",tag:"NEW",owner:"",c1:pal[n%pal.length],c2:"#ffffff"});
    others();renderTeams();
    const f=document.getElementById("t-t"+n+"-club");if(f){f.focus();f.select()}
  }
  else if(act==="delteam"){
    const tid=el.dataset.t;
    if(ask("del:"+tid)){state.teams=state.teams.filter(t=>t.id!==tid);state.matches=state.matches.filter(x=>x.h!==tid&&x.a!==tid);others();renderTeams()}
  }
  else if(act==="regen"){
    const need=state.matches.length>0;
    if(!need||ask("regen")){view.confirm=null;state.matches=schedule(state.teams.map(t=>t.id),state.legs===2?2:1);view.goalsOpen.clear();others();renderTeams()}
  }
  else if(act==="keepex"){state.example=false;view.edit=true;renderAll()}
  else if(act==="blank"){state.example=false;state.name="Mi liga";state.season="";state.rules="";state.teams=[];state.matches=[];view.edit=true;renderAll();location.hash="#equipos"}
  else if(act==="save")save();
  else if(act==="discard"){state=JSON.parse(baseline);view.goalsOpen.clear();view.msg="";renderAll()}
  else if(act==="restore"){try{state=JSON.parse(view.stash)}catch(err){}view.stash=null;view.edit=true;renderAll()}
  else if(act==="dropstash"){try{sessionStorage.removeItem(SKEY)}catch(err){}view.stash=null;renderBanner()}
});
app.addEventListener("change",e=>{
  const t=e.target;
  if(t.classList.contains("sc")){
    const m=state.matches.find(x=>x.id===t.dataset.m);if(!m)return;
    const v=t.value.trim(),n=v===""?null:Math.max(0,Math.min(99,parseInt(v,10)||0));
    m[t.dataset.s==="h"?"hs":"as"]=n;if(n!==null)t.value=n;
    const li=t.closest(".match");if(li)li.classList.toggle("done",isPlayed(m));
    derived();return;
  }
  if(t.dataset.gf){
    const m=state.matches.find(x=>x.id===t.dataset.m),g=m&&m.goals[+t.dataset.g];if(!g)return;
    const f=t.dataset.gf;
    if(f==="n"){g.n=Math.max(1,Math.min(20,parseInt(t.value,10)||1));t.value=g.n}
    else if(f==="p")g.p=t.value.trim().slice(0,30);
    else g.s=t.value==="a"?"a":"h";
    derived();return;
  }
  if(t.dataset.t&&t.dataset.f){
    const tm=team(t.dataset.t);if(!tm)return;
    const f=t.dataset.f;
    if(f==="tag")tm.tag=t.value.toUpperCase().slice(0,3);
    else if(f==="c1"||f==="c2")tm[f]=col(t.value);
    else tm[f]=t.value.trim();
    if(f==="tag")t.value=tm.tag;
    if(f==="tag"||f==="c1"||f==="c2"){const li=t.closest(".trow"),old=li&&li.querySelector(".crestw");if(old){const tp=document.createElement("template");tp.innerHTML=crest(tm,"lg");old.replaceWith(tp.content.firstElementChild)}}
    others();return;
  }
  if(t.dataset.cfg){
    const k=t.dataset.cfg;
    if(k==="legs")state.legs=t.value==="2"?2:1;
    else state[k]=t.value.trim();
    view.msg="";renderHead();renderBar();return;
  }
  if(t.id==="clubfilter"){view.club=t.value;renderFixture();const s=$("#clubfilter");if(s)s.focus()}
});
window.addEventListener("hashchange",()=>{view.tab=tabFromHash();applyTab()});

/* ---------- Arranque ---------- */
async function use(n){try{const r=await (window.claude&&window.claude.use?window.claude.use(n):null);return r||null}catch(e){return null}}
renderAll();
(async()=>{
  const u=await use("user");
  if(u){try{canEdit=!!(await u.canEdit())}catch(e){}}
  api=await use("artifact");
  if(!api)canEdit=false;
  if(canEdit){
    try{const st=sessionStorage.getItem(SKEY);if(st){if(st===baseline)sessionStorage.removeItem(SKEY);else view.stash=st}}catch(e){}
  }
  renderAll();
})();
})();
</script></body></html>
